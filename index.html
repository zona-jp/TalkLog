<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="会話をリアルタイムに文字起こしし、自分と相手の発言を分けて表示するツール。">
<meta name="color-scheme" content="light dark">
<title>TalkLog — リアルタイム会話文字起こし</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6cbd'/%3E%3Cpath d='M16 7a3.2 3.2 0 0 0-3.2 3.2v5.4a3.2 3.2 0 1 0 6.4 0v-5.4A3.2 3.2 0 0 0 16 7Zm-7 8.2a1 1 0 0 1 2 0 5 5 0 0 0 10 0 1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V24h2.5a1 1 0 1 1 0 2h-7a1 1 0 1 1 0-2H15v-1.87A7 7 0 0 1 9 15.2Z' fill='%23fff'/%3E%3C/svg%3E">
<!-- ?v= はキャッシュ対策。ファイルを更新したら必ずこの数字を上げること
     （GitHub Pages は 10 分間ブラウザにキャッシュさせるため、
       これが無いと index.html だけ新しく app.js が古い、という事故が起きる） -->
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<noscript>
  <div class="noscript">このアプリの動作には JavaScript が必要です。</div>
</noscript>

<div class="app">

  <!-- ===== ヘッダー ===== -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><path d="M16 7a3.2 3.2 0 0 0-3.2 3.2v5.4a3.2 3.2 0 1 0 6.4 0v-5.4A3.2 3.2 0 0 0 16 7Zm-7 8.2a1 1 0 0 1 2 0 5 5 0 0 0 10 0 1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V24h2.5a1 1 0 1 1 0 2h-7a1 1 0 1 1 0-2H15v-1.87A7 7 0 0 1 9 15.2Z" fill="currentColor"/></svg>
      </span>
      <div class="brand-text">
        <h1>TalkLog</h1>
        <p>リアルタイム会話文字起こし</p>
      </div>
    </div>

    <div id="session-badge" class="session-badge" data-state="idle">
      <span class="dot" aria-hidden="true"></span>
      <span id="session-badge-text">待機中</span>
      <span id="session-timer" class="timer" hidden>00:00</span>
    </div>
  </header>

  <!-- ===== 入力状態 ===== -->
  <div class="status-row">
    <span class="stat" id="pill-mic" data-state="off">
      <span aria-hidden="true">🎤</span>マイク：<b id="pill-mic-value">未接続</b>
    </span>
    <span class="stat" id="pill-pc" data-state="off">
      <span aria-hidden="true">🔊</span>相手音声：<b id="pill-pc-value">未接続</b>
    </span>
  </div>

  <!-- ===== 主操作 ===== -->
  <div class="main-controls">
    <button id="btn-start" class="btn btn-primary" type="button">
      <span class="btn-ico" aria-hidden="true">▶</span>文字起こし開始
    </button>
    <button id="btn-stop" class="btn btn-danger" type="button" disabled>
      <span class="btn-ico" aria-hidden="true">■</span>停止
    </button>
  </div>

  <!-- ===== 通知（問題があるときだけ表示） ===== -->
  <div id="alert-area" class="alert-area" role="status" aria-live="polite"></div>

  <!-- ===== 会話ログ ===== -->
  <main class="transcript-wrap">
    <div id="scroll-area" class="scroll-area" tabindex="0" aria-label="会話ログ">
      <p id="trim-notice" class="trim-notice" hidden>表示を軽くするため、古いメッセージは画面上から省略しています（保存・コピーには全件含まれます）。</p>

      <div id="empty-state" class="empty-state">
        <div class="empty-ico" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="44" height="44"><path d="M8 10h32a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3H21l-9 7v-7H8a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M13 19h22M13 25h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </div>
        <p class="empty-title">まだ会話がありません</p>
        <p class="empty-desc">「文字起こし開始」を押すと、会話がここにリアルタイムで表示されます。</p>
      </div>

      <div id="entry-list" class="entry-list"></div>
      <div id="live-area" class="live-area"></div>
    </div>

    <button id="btn-jump" class="jump-btn" type="button" hidden>
      最新へ<span id="jump-count" class="jump-count"></span>
    </button>
  </main>

  <!-- ===== 副操作 ===== -->
  <div class="sub-controls">
    <button id="btn-copy" class="btn btn-ghost" type="button">コピー</button>
    <button id="btn-txt" class="btn btn-ghost" type="button">TXT保存</button>
    <button id="btn-clear" class="btn btn-ghost btn-ghost-danger" type="button">クリア</button>
    <span class="grow"></span>
    <span id="stat-count" class="count">0 件</span>
  </div>

  <footer class="app-footer">
    音声はブラウザの音声認識機能（日本語）で処理されます。外部サーバーで処理される場合があります。
  </footer>
</div>

<div id="toast-area" class="toast-area" aria-live="polite"></div>

<script src="app.js?v=3"></script>
</body>
</html>
